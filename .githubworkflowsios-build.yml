name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Restore
        run: dotnet restore AvaloniaApplication2.iOS/AvaloniaApplication2.iOS.csproj

      - name: Build (unsigned ipa)
        run: |
          dotnet publish AvaloniaApplication2.iOS/AvaloniaApplication2.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            /p:BuildIpa=true \
            /p:CodeSignEntitlements= \
            /p:Codesignentitlements= \
            -o out

      - name: Find ipa
        run: find out -name "*.ipa"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: out/**/*.ipa