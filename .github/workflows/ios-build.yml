name: Build iOS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          sudo xcodebuild -runFirstLaunch || true
          xcode-select -p
          xcodebuild -version

      - name: Install iOS 26.0 platform
        run: |
          sudo xcodebuild -downloadPlatform iOS -version 26.0 || \
          sudo xcodebuild -downloadPlatform iOS || true
          echo "=== 已安装的平台 ==="
          ls /Applications/Xcode_26.0.1.app/Contents/Developer/Platforms/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Restore
        run: dotnet restore AvaloniaApplication2/AvaloniaApplication2.iOS/AvaloniaApplication2.iOS.csproj

      - name: Build (no ipa)
        run: |
          dotnet publish AvaloniaApplication2/AvaloniaApplication2.iOS/AvaloniaApplication2.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            /p:BuildIpa=false \
            /p:EnableCodeSigning=false \
            /p:CodesignKey="" \
            /p:CodesignProvision="" \
            /p:CodesignEntitlements="" \
            -o out

      - name: Find app bundle
        run: find out -name "*.app" -maxdepth 2

      - name: Pack into zip
        run: |
          cd out
          APP=$(find . -name "*.app" -maxdepth 1 | head -1)
          if [ -n "$APP" ]; then
            zip -r ../app-payload.zip "$APP"
          else
            zip -r ../app-payload.zip .
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          path: app-payload.zip