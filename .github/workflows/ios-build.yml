name: Build iOS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Restore
        run: dotnet restore AvaloniaApplication2/AvaloniaApplication2.iOS/AvaloniaApplication2.iOS.csproj

      - name: Build (no signing)
        run: |
          dotnet publish AvaloniaApplication2/AvaloniaApplication2.iOS/AvaloniaApplication2.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            /p:CodesigningAllowed=false \
            /p:BuildIpa=false \
            -o out

      - name: Pack app bundle into zip
        run: |
          cd out
          APP=$(find . -name "*.app" -maxdepth 1 | head -1)
          zip -r ../app-payload.zip "$APP"
          cd ..

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-bundle
          path: app-payload.zip